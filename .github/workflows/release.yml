name: Release

# Build heraldo's signed .deb with packaging/build.sh (Briefcase + debsigs) and
# attach the .debs to a GitHub Release when a version tag (v*) is pushed. The
# tag must match [project].version in pyproject.toml.
# Pull requests and manual runs build and upload artifacts only (no release).
on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (linux ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 64-bit Raspberry Pi OS (arm64). Native build on an Arm runner;
          # 32-bit armhf would need QEMU or a self-hosted Pi. Raspberry Pi OS
          # is built on Debian, trixie has (python3 3.13), not Ubuntu 24 (python3 3.12), and
          # Briefcase's "linux system" target hard-fails unless the
          # interpreter running Briefcase IS the machine's system python3
          # (verify_system_python(), no override) -- so a deadsnakes
          # python3.13 alongside noble's own python3 doesn't work, it has
          # to actually be the system python3. Building inside a debian:trixie
          # container (native on this arm64 runner, no QEMU) makes that true,
          # and gets Briefcase's auto `libpython<ver>` dependency right too.
          - runner: ubuntu-24.04-arm
            arch: aarch64
            container: "debian:trixie"
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      # debian:trixie's container image is minimal: no sudo (we're root
      # already, but the steps below assume a sudo-prefixed non-root user)
      # and no git (actions/checkout needs it). No-op outside a container.
      - name: Bootstrap container image
        if: matrix.container != ''
        run: apt-get update && apt-get install -y sudo git ca-certificates

      - uses: actions/checkout@v4

      # ubuntu-24.04's python3 is 3.12, debian:trixie's is 3.13 (Briefcase
      # 0.4.7+ needs 3.11+). Briefcase compiles dbus-python/PyGObject/pycairo
      # into the package and checks that the runtime packages (bluez, ...)
      # are installed.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bluez gir1.2-glib-2.0 libcairo2 libdbus-1-3 libgirepository-1.0-1 \
            libcairo2-dev libdbus-1-dev libgirepository1.0-dev libglib2.0-dev \
            pkg-config python3-dev python3-venv dpkg-dev debsigs debsig-verify

      - name: Install Briefcase
        run: |
          python3 -m venv .venv
          .venv/bin/pip install "briefcase>=0.4.7"

      # build.sh needs a GPG secret key to sign the .deb: add the private key
      # (no passphrase) as the HERALDO_GPG_PRIVATE_KEY repo secret, and
      # optionally its fingerprint as HERALDO_GPG_KEY. Releases (tags) require
      # the secret; pull requests and manual runs without it sign with a
      # throwaway key so the build and signing still get tested.
      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.HERALDO_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "${GPG_PRIVATE_KEY}" ]; then
            printf '%s\n' "${GPG_PRIVATE_KEY}" | gpg --batch --import
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "::error::the HERALDO_GPG_PRIVATE_KEY secret isn't set; a GPG key is needed to sign release packages"
            exit 1
          else
            echo "::warning::HERALDO_GPG_PRIVATE_KEY isn't set; signing with a throwaway test key"
            gpg --batch --passphrase '' --quick-gen-key "heraldo CI test key <ci@invalid>" ed25519 sign 1d
          fi

          # debsigs (built on the old PGP::Sign Perl module) signs with the
          # SHA1 digest unless told otherwise, and GnuPG on noble refuses to
          # even check SHA1 signatures ("Can't check signature: Invalid
          # digest algorithm"), so debsig-verify fails on an otherwise
          # correctly signed package. Force SHA256 for signing here and for
          # the verify step's checks later.
          mkdir -p ~/.gnupg
          printf 'digest-algo SHA256\ncert-digest-algo SHA256\n' >> ~/.gnupg/gpg.conf

      - name: Build .deb
        env:
          BRIEFCASE: .venv/bin/briefcase
          HERALDO_GPG_KEY: ${{ secrets.HERALDO_GPG_KEY }}
        shell: bash
        run: packaging/build.sh 2>&1 | tee build-output.txt

      # Show why Briefcase failed: its log (logs/) as an artifact, and the
      # last lines as an annotation on the run.
      - name: Briefcase log on failure
        if: failure()
        run: |
          log="$(ls -t logs/*.log 2>/dev/null | head -1 || true)"
          log="${log:-build-output.txt}"
          if [ -n "${log}" ]; then
            # Error lines (e.g. a failed compile) are more useful than the traceback.
            { grep -iE 'error|not found|missing|required|failed' "${log}" | grep -v '^│' | tail -n 40 || tail -n 40 "${log}"; } | python3 -c 'import sys; print("::error title=Briefcase log::" + sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: briefcase-logs-${{ matrix.arch }}
          path: logs/
          if-no-files-found: ignore

      # Check the embedded debsigs signature the way an installing machine
      # would: debsig-verify with a policy and keyring for the signing key.
      - name: Verify package signature
        shell: bash
        env:
          HERALDO_GPG_KEY: ${{ secrets.HERALDO_GPG_KEY }}
        run: |
          fpr="$(gpg --batch --with-colons --list-secret-keys ${HERALDO_GPG_KEY:+"${HERALDO_GPG_KEY}"} | awk -F: '$1 == "fpr" { print $10; exit }')"
          keyid="${fpr: -16}"
          sudo mkdir -p "/etc/debsig/policies/${keyid}" "/usr/share/debsig/keyrings/${keyid}"
          gpg --batch --export "${fpr}" | sudo tee "/usr/share/debsig/keyrings/${keyid}/debsig.gpg" >/dev/null
          sudo tee "/etc/debsig/policies/${keyid}/heraldo.pol" >/dev/null <<POLICY
          <?xml version="1.0"?>
          <!DOCTYPE Policy SYSTEM "https://www.debian.org/debsig/1.0/policy.dtd">
          <Policy xmlns="https://www.debian.org/debsig/1.0/">
            <Origin Name="heraldo" id="${keyid}" Description="heraldo package signing key"/>
            <Selection>
              <Required Type="origin" File="debsig.gpg" id="${keyid}"/>
            </Selection>
            <Verification MinOptional="0">
              <Required Type="origin" File="debsig.gpg" id="${keyid}"/>
            </Verification>
          </Policy>
          POLICY
          for deb in dist/*.deb; do
            # Diagnostics for a "Failed verification" with no other detail:
            # confirm control.tar/data.tar got the .xz compression build.sh
            # requests (not dpkg-deb's zstd default, which debsigs 0.1.26
            # can't read and may sign incompletely), and ask debsig-verify
            # why the signature didn't check out.
            echo "::group::ar members of ${deb}"
            ar tv "${deb}"
            echo "::endgroup::"
            if ! out="$(debsig-verify -d "${deb}" 2>&1)"; then
              printf '%s\n' "${out}"
              printf '%s' "${out}" | python3 -c 'import sys; print("::error title=Signature check failed::" + sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
              exit 1
            fi
            printf '%s\n' "${out}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: heraldo-linux-${{ matrix.arch }}-{{ matrix.container }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
