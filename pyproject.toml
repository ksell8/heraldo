[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heraldo"
version = "0.0.0"
description = "BLE advertising beacon library for Raspberry Pi using BlueZ/DBus"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kurt Sell", email = "kurt.sell8@gmail.com" }]
# dbus-python and PyGObject require system libraries; on Raspberry Pi install
# via: sudo apt install python3-dbus python3-gi
# PyGObject 3.51+ needs girepository-2.0 (GLib 2.80+), which Raspberry Pi OS
# bookworm and Ubuntu 22.04 don't have.
dependencies = [
    "dbus-python; sys_platform == 'linux'",
    "PyGObject<3.51; sys_platform == 'linux'",
]

[project.scripts]
heraldo = "heraldo.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["heraldo"]

# --- Briefcase packaging (packaging/build.sh) ------------------------------
# `briefcase package linux system` builds a .deb. The version comes from
# [project].version.
[tool.briefcase]
project_name = "heraldo"
bundle = "io.github.ksell8"
url = "https://github.com/ksell8/heraldo"

[tool.briefcase.app.heraldo]
formal_name = "heraldo"
description = "BLE beacon advertiser (iBeacon, Eddystone) using BlueZ"
long_description = """heraldo advertises iBeacon and Eddystone beacons through BlueZ over D-Bus.
"""
sources = ["heraldo"]
console_app = true

[tool.briefcase.app.heraldo.linux.system.debian]
# Needed on the build machine to compile dbus-python, PyGObject and pycairo.
system_requires = [
    "libcairo2-dev",
    "libdbus-1-dev",
    "libgirepository1.0-dev",
    "libglib2.0-dev",
    "pkg-config",
]
system_runtime_requires = [
    "bluez",
    "gir1.2-glib-2.0",
    "libcairo2",
    "libdbus-1-3",
    "libgirepository-1.0-1",
]
system_section = "net"
